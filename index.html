<!doctype html>
<html lang="id" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Yuumotion: Hybrid Notion + Trello workspace. Playful Tactile, offline-first." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Yuumotion - Workspace & Docs</title>

    <!-- Google Fonts: Bricolage Grotesque, Onest, Commit Mono fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Inline script anti-FOUC: jalankan sebelum React mount -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('yuumotion_preferences');
          const prefs = stored ? JSON.parse(stored) : {};
          const theme = prefs.theme || 'light';
          const density = prefs.density || 'comfortable';
          const reduceMotion = !!prefs.reduceMotion;

          let isDark = theme === 'dark';
          if (theme === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            const meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#111113');
          } else {
            document.documentElement.classList.remove('dark');
          }

          document.documentElement.setAttribute('data-density', density);
          if (reduceMotion) {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-project-soft selection:text-project-accent font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
