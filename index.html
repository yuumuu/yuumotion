<!doctype html>
<html lang="id" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9FA" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Yuumotion adalah ruang kerja produktivitas open-source offline-first yang menggabungkan Kanban Board multi-view (Tabel, Kalender, Gantt Timeline) dan editor dokumen TipTap." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yuumotion.wasmer.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yuumotion" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Yuumotion — Ruang Kerja Kanban, Timeline &amp; Dokumen Tim" />
    <meta property="og:description" content="Satu ruang kerja open-source offline-first untuk Kanban Board multi-view, Gantt Timeline, Kalender, dan editor dokumen Notion-style." />
    <meta property="og:url" content="https://yuumotion.wasmer.app/" />
    <meta property="og:image" content="https://yuumotion.wasmer.app/icon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yuumotion — Ruang Kerja Kanban, Timeline &amp; Dokumen Tim" />
    <meta name="twitter:description" content="Ruang kerja produktivitas open-source offline-first untuk Kanban multi-view dan dokumen TipTap." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Yuumotion — Kanban Board, Timeline &amp; Dokumen Tim</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Yuumotion",
        "url": "https://yuumotion.wasmer.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Ruang kerja produktivitas open-source offline-first dengan Kanban Board multi-view, Gantt Timeline, Kalender, dan editor dokumen TipTap."
      }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans, Bricolage Grotesque, Playfair Display, Google Sans Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Google+Sans+Code:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Inline script anti-FOUC: jalankan sebelum React mount -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('yuumotion_preferences');
          const prefs = stored ? JSON.parse(stored) : {};
          const theme = prefs.theme || 'light';
          const density = prefs.density || 'comfortable';
          const reduceMotion = !!prefs.reduceMotion;

          let isDark = theme === 'dark';
          if (theme === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            const meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0C0D0E');
          } else {
            document.documentElement.classList.remove('dark');
          }

          document.documentElement.setAttribute('data-density', density);
          if (reduceMotion) {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-project-soft selection:text-project-accent font-sans">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
        <svg viewBox="0 0 100 100" fill="none" width="60" height="60" style="border-radius:16px;box-shadow:0 12px 28px -8px rgba(37,99,235,0.4)">
          <defs>
            <linearGradient id="yuu-boot-blue" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3B82F6"/>
              <stop offset="55%" stop-color="#2563EB"/>
              <stop offset="100%" stop-color="#1D4ED8"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="24" fill="url(#yuu-boot-blue)"/>
          <path d="M30 32L50 62L70 32" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="50" cy="75" r="5.5" fill="#BFDBFE"/>
        </svg>
        <span style="font-size:12px;font-weight:500;color:#64748B;letter-spacing:0.02em">Menyiapkan Yuumotion...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
